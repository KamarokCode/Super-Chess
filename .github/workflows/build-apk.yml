name: Compiler l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Vérifier le SDK Android
        run: echo "SDK Android : $ANDROID_HOME" && ls "$ANDROID_HOME/platforms"

      - name: Compiler
        run: gradle --no-daemon assembleRelease

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk "SuperChess-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SuperChess-1.0.${{ github.run_number }}
          path: SuperChess-1.0.${{ github.run_number }}.apk

      - name: Publier la version (page Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Super Chess 1.0.${{ github.run_number }}
          body: |
            APK prêt à installer sur Android 8 ou plus récent.
            Téléchargez **SuperChess-1.0.${{ github.run_number }}.apk** depuis votre téléphone puis ouvrez-le.
          files: SuperChess-1.0.${{ github.run_number }}.apk
          make_latest: true
